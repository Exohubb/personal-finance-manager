# LEARN: This is the main configuration file for a Spring Boot app.
# LEARN: Spring Boot reads this file automatically on startup, no import needed.
# LEARN: Format is simple key=value, one setting per line.

# --- Application info ---
spring.application.name=personalfinancemanager

# --- Server settings ---
# LEARN: server.port controls which port the embedded Tomcat server listens on.
# LEARN: Render (our deployment host) injects its own PORT env variable at runtime,
# LEARN: so this default only matters when running locally.
server.port=8080

# --- Database settings (H2 in-memory) ---
# LEARN: H2 is a lightweight database that can run entirely in memory (RAM).
# LEARN: That means all data is wiped every time the app restarts - fine for
# LEARN: this assignment since we don't need data to survive a restart.
# LEARN: The URL below is a JDBC connection string H2 understands.
spring.datasource.url=jdbc:h2:mem:financedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate settings ---
# LEARN: JPA (Java Persistence API) is the standard way Java/Kotlin talks to a
# LEARN: database using objects instead of raw SQL. Hibernate is the library
# LEARN: that actually implements JPA under the hood.
# LEARN: ddl-auto=update tells Hibernate to look at our @Entity classes and
# LEARN: automatically create/update the matching database tables on startup.
spring.jpa.hibernate.ddl-auto=update
# LEARN: show-sql prints the generated SQL to the console, handy while learning.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- H2 web console (optional, useful for debugging) ---
# LEARN: Enabling this gives us a browser-based UI to inspect the H2 database
# LEARN: while the app is running locally, at /h2-console.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Session settings ---
# LEARN: The assignment requires session-based auth (not token/JWT based).
# LEARN: Spring Security creates a session automatically on login and issues a
# LEARN: cookie (JSESSIONID) that the client sends back on every request.
# LEARN: timeout controls how long a session stays valid without activity.
server.servlet.session.timeout=30m
