spring.application.name=personalfinancemanager

# Render injects its own PORT environment variable at runtime; ${PORT:8080}
# falls back to 8080 when running locally where PORT isn't set.
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:mem:financedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.servlet.session.timeout=30m
